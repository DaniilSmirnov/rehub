name: Run Playwright Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e2e_tests.yaml'
      - 'lib/**'
      - 'Dockerfile'
      - 'test/e2e/**'
      - 'docker-compose-e2e-tests.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'ui/**'

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --volumes -a -f
          df -h /

      # GitHub-hosted Linux runners expose /dev/kvm, but only to root by
      # default. The emulator container is privileged and uses it when present.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose services
        run: docker compose -f docker-compose-e2e-tests.yaml build

      - name: Run Playwright E2E tests
        run: |
          docker compose -f docker-compose-e2e-tests.yaml up \
            --exit-code-from devicehub-e2e-tests \
            --abort-on-container-exit \
            devicehub-e2e-tests

      - name: Show logs for emulator
        if: always()
        continue-on-error: true
        run: docker compose -f docker-compose-e2e-tests.yaml logs --tail 300 emulator

      - name: Show logs for E2E tests
        if: always()
        continue-on-error: true
        run: docker compose -f docker-compose-e2e-tests.yaml logs devicehub-e2e-tests

      - name: Show Playwright error context
        if: failure()
        continue-on-error: true
        run: |
          for f in test/e2e/test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

      - name: Show logs for devicehub
        if: always()
        continue-on-error: true
        run: docker compose -f docker-compose-e2e-tests.yaml logs --tail 3000 devicehub

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f docker-compose-e2e-tests.yaml down --remove-orphans
